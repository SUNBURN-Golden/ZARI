[workspace]
resolver = "2"
members = ["crates/core", "crates/wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
schemars = "=1.2.2"
wasm-bindgen = "=0.2.128"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
